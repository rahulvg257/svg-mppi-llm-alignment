[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisp-repro"
version = "0.1.0"
description = "Reproduction-oriented AISP pipeline for TinyLlama on Anthropic HH-RLHF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.2.0",
  "datasets>=3.2.0",
  "matplotlib>=3.8.0",
  "pandas>=2.2.0",
  "psutil>=6.0.0",
  "PyYAML>=6.0.0",
  "scikit-learn>=1.6.0",
  "safetensors>=0.4.5",
  "torch>=2.4.0",
  "tqdm>=4.66.0",
  "transformers>=4.46.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

